# Question bank — REDESIGN PILOT.
#
# Twelve tier-1 questions, chosen in docs/redesign.md §8 to split the six broad
# groups as far as everyday values can. The 55 questions this replaced are on
# the annotated tag `pre-redesign`; retrieve one with
# `git show pre-redesign:content/questions.yaml`. Nothing is duplicated in the
# repo, and the scale-up restores them one at a time, rewritten to the tier
# rules (docs/redesign-baseline.md).
#
# TIER 1 MEANS: a respondent with no political education, no vocabulary and no
# interest in politics can answer it from their own life. Stems ≤ 18 words,
# options ≤ 8 words, 2-5 options, reading grade ≤ 7, no tooltip, nothing from
# content/lint/tier1-banned.txt, and everyday situations only — a job, a
# landlord, a hospital, a police stop, a will. No invented revolutions.
# `npm run lint:content` enforces all of it; none of these carries a waiver.
#
# Implicit options `unsure` and `unknown_term` are injected by the loader and
# never appear here. `likert5` questions get the five canonical points the same
# way. Neither ever updates a score.

questions:
  # ---------------------------------------------------------------------------
  # How change happens — the main axis tier 1 can reach
  # ---------------------------------------------------------------------------

  - id: t1_elections_change_things
    depth: 1
    kind: likert5
    tags: [change, government]
    text: >-
      Voting changes who is in charge, but not who really runs things.
    follow_ups:
      - when:
          answer_in: [strongly_agree, agree]
        ask: [t1_how_change_happens]
        mode: boost
        boost: 2.0

  - id: t1_how_change_happens
    depth: 1
    kind: single_choice
    tags: [change, strategy]
    text: >-
      Which is closest to how things actually get better?
    options:
      - id: laws_step_by_step
        short: laws passed one at a time
        label: >-
          Laws passed, one at a time.
      - id: organise_until_they_give_way
        short: organising until those in charge give way
        label: >-
          People organising until those in charge give way.
      - id: build_alongside
        short: building something better alongside
        label: >-
          Building something better alongside, and spreading it.
      - id: everything_changes_hands
        short: everything changing hands at once
        label: >-
          Everything changing hands at once.
    follow_ups:
      - when:
          answer_in: [everything_changes_hands, organise_until_they_give_way]
        ask: [t1_force_in_politics]
        mode: boost
        boost: 1.5

  # ---------------------------------------------------------------------------
  # Work and who owns it
  # ---------------------------------------------------------------------------

  - id: t1_who_should_own_work
    depth: 1
    kind: likert5
    tags: [work, ownership]
    text: >-
      The people who work somewhere should own it.
    follow_ups:
      - when:
          answer_in: [strongly_agree, agree, disagree, strongly_disagree]
        ask: [t1_final_say_at_work]
        mode: force

  - id: t1_final_say_at_work
    depth: 1
    kind: single_choice
    tags: [work, control]
    text: >-
      At a large workplace, who should have the final say?
    options:
      - id: the_owners
        short: the people who own it
        label: >-
          The people who own it.
      - id: managers_an_elected_government_picks
        short: managers an elected government picks
        label: >-
          Managers picked by an elected government.
      - id: the_people_who_work_there
        short: the people who work there
        label: >-
          The people who work there.
      - id: everyone_it_serves
        short: everyone who uses what it makes
        label: >-
          Everyone who uses what it makes.

  - id: t1_paid_for_together
    depth: 1
    kind: likert5
    tags: [public, money]
    text: >-
      Health care and housing should be run by government, not bought and sold.

  - id: t1_how_much_inequality
    depth: 1
    kind: likert5
    tags: [money, fairness]
    text: >-
      Some people earning twenty times what others earn is wrong, however hard
      they work.

  # ---------------------------------------------------------------------------
  # Authority: police, unjust laws, force
  # ---------------------------------------------------------------------------

  - id: t1_police_instead
    depth: 1
    kind: single_choice
    tags: [police, safety]
    text: >-
      What would you want in place of the police as they are?
    options:
      - id: same_but_answerable
        short: the same, but properly answerable
        label: >-
          The same, but properly answerable.
      - id: fewer_police_more_support
        short: fewer police, more support services
        label: >-
          Fewer of them, more support services.
      - id: neighbourhoods_handle_it
        short: neighbourhoods handling it themselves
        label: >-
          Neighbourhoods handling it themselves.
      - id: ordinary_people_elected
        short: ordinary people, elected and trained
        label: >-
          Ordinary people, elected and trained.
      - id: nothing_like_it_at_all
        short: nothing like it at all
        label: >-
          Nothing of the kind at all.

  - id: t1_unjust_law
    depth: 1
    kind: single_choice
    tags: [law, protest]
    text: >-
      A law is clearly unjust. What should people do?
    options:
      - id: obey_and_campaign
        short: obey it and campaign to change it
        label: >-
          Obey it, and campaign to change it.
      - id: break_openly_take_punishment
        short: break it openly and take the punishment
        label: >-
          Break it openly and accept the punishment.
      - id: break_it_and_avoid
        short: break it and avoid getting caught
        label: >-
          Break it, and avoid getting caught.
      - id: obeying_was_never_the_point
        short: obeying was never the point
        label: >-
          Obeying was never really the point.
    follow_ups:
      - when:
          answer_in: [break_openly_take_punishment, break_it_and_avoid, obeying_was_never_the_point]
        ask: [t1_police_instead]
        mode: boost
        boost: 1.5

  - id: t1_force_in_politics
    depth: 1
    kind: single_choice
    tags: [force, change]
    text: >-
      Is there ever a good reason to use force to change how a country is run?
    options:
      - id: never_for_any_reason
        short: no, never, for any reason
        label: >-
          No, never, for any reason.
      - id: only_defending_people
        short: only to defend people being attacked
        label: >-
          Only to defend people being attacked.
      - id: when_nothing_else_worked
        short: yes, when nothing else has worked
        label: >-
          Yes, when nothing else has worked.
      - id: nobody_gives_up_willingly
        short: yes, nobody gives up willingly
        label: >-
          Yes. Nobody gives up willingly.

  # ---------------------------------------------------------------------------
  # Where your politics comes from, and who it is for
  # ---------------------------------------------------------------------------

  - id: t1_faith_and_right
    depth: 1
    kind: likert5
    tags: [faith, values]
    text: >-
      My sense of right and wrong comes mainly from my religion.
    modifier_tags:
      strongly_agree: religion
      agree: religion

  - id: t1_wealth_from_elsewhere
    depth: 1
    kind: likert5
    tags: [money, world]
    text: >-
      Rich countries are rich partly because of what they took from poorer ones.
    modifier_tags:
      strongly_agree: anti_colonial
      agree: anti_colonial

  - id: t1_run_our_own_affairs
    depth: 1
    kind: likert5
    tags: [place, belonging]
    text: >-
      People should run their own affairs, in their own area and language.
    modifier_tags:
      strongly_agree: nation
      agree: nation
