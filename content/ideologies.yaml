  # ===========================================================================

  - id: post_marxism
    name: Post-Marxism
    aliases: [radical democracy, post-Marxist radical democracy]
    family: post_marxist
    roster_tier: core
    summary: >-
      Holds that there is no single revolutionary subject given in advance, and
      that a socialist majority has to be built by linking many distinct
      democratic demands into a shared political front.
    reading: []
    stances: {}

  - id: eurocommunism
    name: Eurocommunism
    aliases: [democratic communism, the Italian road to socialism]
    family: post_marxist
    roster_tier: core
    summary: >-
      Holds that a mass communist party should pursue socialism by winning
      consent across society and competing in free elections, keeping political
