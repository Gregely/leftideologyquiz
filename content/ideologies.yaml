          Defining: the leader is the centre of the political body and settles
          what the line is. Reverse it and collective leadership returns and the
          doctrine collapses into ordinary Marxism-Leninism.
      d1_pluralism_after: { accept: [one_movement_with_allies, one_party], reject: [no_state_to_contest], weight: 1 }

  - id: deng_xiaoping_theory
    name: Deng Xiaoping Theory
    aliases: [socialism with Chinese characteristics, reform and opening up]
    family: marxism_leninism
    tendency: marxism_leninism
    roster_tier: boundary
    boundary: true
    summary: >-
      Holds that a socialist country in the primary stage must develop its
      productive forces first, using markets and foreign investment under
      continued leadership by the communist party.
    reading: []
    stances:
      d1_price_signals:
        accept: [strongly_agree, agree]
        reject: [strongly_disagree]
        weight: 3
        note: >-
          Defining: the market is a method rather than a property of capitalism,
          which is the claim that licenses everything else in the doctrine. Reverse
          it and what is left is the administratively planned economy the theory was
          formulated to replace.
      d1_expropriation: { accept: [no_transfer_at_all], weight: 2 }
      d1_land: { accept: [to_those_who_work_it], weight: 2 }
      d1_planning_or_market:
        accept: [regulated_market]
        reject: [central_plan_with_targets, direct_allocation_by_need]
        weight: 3
        note: >-
          Defining: markets do the allocating while the party holds the
          commanding heights. Reverse it and this is the planned economy the
          reform was a break from.
      d1_growth:
        accept: [strongly_agree]
        reject: [strongly_disagree]
        weight: 3
        note: >-
          Defining: development comes first and distribution later, because
          poverty is not socialism. Reverse it and the whole justification for
          the market reforms goes.
      d1_ownership: { accept: [public_ownership_planned, private_with_strong_public], weight: 2 }
      d1_pluralism_after: { accept: [one_movement_with_allies, one_party], reject: [no_state_to_contest], weight: 2 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], weight: 2 }

  - id: xi_jinping_thought
