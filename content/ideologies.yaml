      d1_faith_grounds: { accept: [material_interest], weight: 1 }
      d1_individual_sovereignty: { accept: [collective_prior], weight: 1 }
      d1_peasantry: { accept: [strongly_agree], weight: 2 }

  - id: marxism_leninism_maoism
    name: Marxism–Leninism–Maoism
    aliases: [MLM]
    family: maoism
    tendency: mao_zedong_thought
    roster_tier: core
    summary: >-
      Holds that Maoism is a third and higher stage of Marxism, centred on
      protracted people's war and on cultural revolution as the means of
      preventing capitalist restoration.
    reading: []
    # No depth-1 stance of its own. It accepts exactly what
    # mao_zedong_thought accepts on every question the depth-1 core asks; what
    # separates it — whether people's war is universal or one country's road —
    # is d2_universal_stage. Restating the parent's position at a higher
    # weight would have moved mass off the parent without stating a
    # difference.
    stances: {}

  - id: gonzalo_thought
    name: Gonzalo Thought
    aliases: [Marxism–Leninism–Maoism–Gonzalo Thought]
    family: maoism
    tendency: marxism_leninism_maoism
    lineage: true
    roster_tier: niche
    summary: >-
      Holds that people's war is universally applicable and must be initiated
      rather than awaited, under a militarised party built around a guiding
      ideology and leadership.
    reading: []
    stances:
      # "Initiate the war now" is not separable from the parent's armed-struggle
      # answer by any depth-1 option; it is d2_peoples_war. The guiding-leader
      # stance below is the one depth-1 position held against the parent.
      d1_guiding_leader:
        accept: [leaders_thought_settles]
        reject: [members_decide, no_leaders]
        weight: 3
        note: >-
          Defining: one leader's thought is the guide of the party and settles
          disputes. Reverse it and the tradition is indistinguishable from the
          general Maoist line.

