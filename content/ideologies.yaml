# Ideologies — the purged roster, 93 entries.
#
# Skeleton: `stances: {}` and `reading: []` throughout. Stances are authored
# once the question bank is rebuilt against this roster; docs/roster-todo.md
# tracks the count per ideology.
#
# `tendency` names another ideology in the same family that acts as this one's
# parent node. It is set only where a descent is genuinely uncontested, so most
# entries have none — a flat family is more honest than an invented lineage.
# Every parent proposed here is recorded in docs/roster-decisions.md.
#
# Tiering: core = an ideology a test-taker could plausibly land on; niche = the
# rest; boundary = the entries marked as boundary cases on the source roster.
# Exclusions are recorded in docs/roster-purged.md.

ideologies:

  # ===========================================================================
  # Pre-Marxist and early socialism
  # ===========================================================================

  - id: narodnism
    name: Narodnism
    aliases: [Narodnichestvo, agrarian socialism, populist socialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that a peasant country can reach socialism through its existing
      village commune without first passing through capitalism, if the
      intelligentsia goes to the people rather than over them.
    reading: []
    stances: {}

  - id: owenism
    name: Owenism
    aliases: [Owenite socialism, cooperative socialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that character is formed by circumstances, so building cooperative
      communities with humane work, education and common ownership will
      demonstrate a better order and spread it by example.
    reading: []
    stances: {}

  - id: fourierism
    name: Fourierism
    aliases: [Fourierist associationism, phalansterianism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that work becomes attractive when it is matched to people's actual
      passions, and that communities should be organised so that everyone does
      what they are drawn to in varied short spells.
    reading: []
    stances: {}

  - id: saint_simonianism
    name: Saint-Simonianism
    aliases: [Saint-Simonian socialism, industrialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that society should be directed by those who actually produce —
      engineers, scientists, industrialists and workers — with reward following
      contribution and inherited privilege abolished.
    reading: []
    stances: {}

  # ===========================================================================
  # Liberal left
  # ===========================================================================

  - id: social_liberalism
    name: Social liberalism
    aliases: [left-liberalism, new liberalism, progressive liberalism]
    family: liberal_left
    roster_tier: core
    summary: >-
      Holds that formal liberty is empty without the material conditions to use
      it, so the state should guarantee health, education, income security and
      fair opportunity within a regulated market economy.
    reading: []
    stances: {}

  - id: liberal_socialism
    name: Liberal socialism
    aliases: [social-liberal socialism, ethical liberal socialism]
    family: liberal_left
    roster_tier: core
    summary: >-
      Holds that liberal freedoms and socialist economics require each other,
      and that social ownership is justified precisely because it extends
      individual autonomy rather than subordinating it to the state.
    reading: []
    stances: {}

  - id: distributism
    name: Distributism
    aliases: [distributivism]
    family: liberal_left
    roster_tier: boundary
    boundary: true
    summary: >-
      Holds that productive property should be spread as widely as possible
      among families, smallholders and guilds, so that neither large private
      capital nor the state stands between people and their livelihood.
    reading: []
    stances: {}

  # ===========================================================================
  # Social democracy
  # ===========================================================================

  - id: kautskyism
    name: Kautskyism
    aliases: [orthodox Marxism, Second International Marxism]
    family: social_democracy
    roster_tier: core
    summary: >-
      Holds that capitalism's own development makes the working class the
      majority, so a mass socialist party should win power through the ballot
      and inherit an economy already ripe for socialisation.
    reading: []
    stances: {}

  - id: classical_social_democracy
    name: Classical social democracy
    aliases: [post-war social democracy, welfare-state social democracy]
    family: social_democracy
    roster_tier: core
    summary: >-
      Uses parliamentary majorities and strong unions to build universal public
      provision, full employment and collective bargaining on top of a mixed
      economy, treating the resulting settlement as durable.
    reading: []
    stances: {}

  - id: bernsteinian_revisionism
    name: Bernsteinian revisionism
    aliases: [revisionism, evolutionary socialism]
    family: social_democracy
    tendency: classical_social_democracy
    roster_tier: niche
    summary: >-
      Holds that capitalism will not collapse of its own accord, so socialism
      has to be reached by the accumulation of reforms, and that the movement's
      daily work matters more than the final goal.
    reading: []
    stances: {}

  - id: fabianism
    name: Fabianism
    aliases: [Fabian socialism, gradualism]
    family: social_democracy
    roster_tier: niche
    summary: >-
      Holds that socialism arrives by permeating existing institutions with
      expert argument and incremental legislation, so that collective provision
      is adopted because it is demonstrably better administered.
    reading: []
    stances: {}

  - id: democratic_socialism
    name: Democratic socialism
    aliases: [parliamentary socialism]
    family: social_democracy
    roster_tier: core
    summary: >-
      Uses elections and mass organisation to replace private ownership of the
      major productive assets with social ownership, holding that socialism
      without democracy is not socialism.
    reading: []
    stances: {}

  - id: austromarxism
    name: Austromarxism
    aliases: [Austrian Marxism]
    family: social_democracy
    roster_tier: niche
    summary: >-
      Seeks a democratic road to socialism through patient mass organisation and
      workers' self-education, and treats national and cultural difference as
      something a socialist state should accommodate rather than dissolve.
    reading: []
    stances: {}

  - id: third_way
    name: Third Way
    aliases: [New Labour, market-liberal social democracy, radical centre]
    family: social_democracy
    tendency: bernsteinian_revisionism
    roster_tier: boundary
    boundary: true
    summary: >-
      Accepts market allocation and private ownership as settled and pursues
      social justice through investment in skills, opportunity and a floor under
      the worst outcomes rather than through changing who owns what.
    reading: []
    stances: {}

  # ===========================================================================
  # Market and cooperative socialism
  # ===========================================================================

  - id: market_socialism
    name: Market socialism
    aliases: [socialist market economy, worker-cooperative socialism]
    family: market_socialism
    roster_tier: core
    summary: >-
      Holds that enterprises should be owned by those who work in them or by the
      public, while competing and trading in markets, because prices carry
      information no planning body can assemble.
    reading: []
    stances: {}

  - id: guild_socialism
    name: Guild socialism
    aliases: [national guilds]
    family: market_socialism
    roster_tier: core
    summary: >-
      Holds that industries should be run by self-governing guilds of those who
      work in them, with a state representing people as consumers, so that
      neither producers nor the public dominates the other.
    reading: []
    stances: {}

  # ===========================================================================
