    reading: []
    stances: {}

  - id: ecosocialism
    name: Ecosocialism
    aliases: [eco-socialism, green socialism]
    family: post_marxist
    roster_tier: core
    summary: >-
      Holds that ecological breakdown follows from production organised for
      accumulation, so the remedy is social ownership and democratic direction
      of the economy within ecological limits.
    reading: []
    stances: {}

