  - id: mutualism
    name: Mutualism
    aliases: [Proudhonian mutualism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that property should rest on occupancy and use, that credit should
      be mutualised so people can acquire their own means of work, and that free
      exchange between producers needs no state to police it.
    reading: []
    stances:
      d1_land: { accept: [title_follows_use], reject: [state_or_collective_farms, public_with_secure_tenure], weight: 2 }
      d1_price_signals: { accept: [strongly_agree], reject: [strongly_disagree], weight: 2 }
      d1_ownership:
        accept: [occupancy_and_use]
        reject: [common_ownership_no_market, private_with_strong_public]
        weight: 3
        note: >-
          Defining: title follows use, so a thing is yours while you are using
          it and not otherwise. Reverse it and this is either capitalism or
          communism, both of which it rejects.
      d1_distribution:
        accept: [free_exchange]
        reject: [by_need]
        weight: 3
        note: >-
          Defining: exchange at cost between producers, with no rent or interest
          taken. Reverse it and the whole account of how exploitation happens
          goes with it.
      d1_planning_or_market: { accept: [market_between_worker_firms], reject: [central_plan_with_targets], weight: 2 }
      d1_workplace_control: { accept: [workers_self_manage], weight: 2 }
