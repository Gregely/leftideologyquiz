  - id: christian_anarchism
    name: Christian anarchism
    aliases: [Tolstoyanism, Christian nonresistance]
    family: anarchism
    roster_tier: niche
    summary: >-
      Holds that the gospel forbids both violence and rule over others, so no
      state can be obeyed where it commands either, and that people should live
      in voluntary community and simple labour.
    reading: []
    stances:
      d1_police_and_army:
        accept: [no_armed_body]
        reject: [rebuilt_under_new_authority, accountable_professional_force]
        weight: 3
        note: >-
          Defining: the refusal to meet force with force is the whole ground of the
          position, and is what makes it a refusal of the state rather than a plan
          for a better one. Reverse it and it becomes an ordinary anarchism with
          religious language.
      d1_land: { accept: [title_follows_use], weight: 1 }
      d1_religion_and_liberation: { accept: [ally_of_liberation], reject: [obstacle_to_liberation], weight: 2 }
      d1_faith_grounds:
        accept: [grounds_it]
        reject: [secular_reason, material_interest]
        weight: 3
        note: >-
          Defining: the refusal of the state is a religious commitment, not a
          political conclusion. Reverse it and this is ordinary anarchism.
      d1_violence:
        accept: [principled_nonviolence]
        reject: [offensive_action, armed_struggle_now]
        weight: 3
        note: >-
          Defining: non-resistance, held even under attack. Reverse it and the
          tradition loses the commitment that separates it from the rest of the
          family.
      d1_state_role: { accept: [bypass_and_build, abolish_outright], reject: [use_and_expand, smash_and_replace, win_own_state], weight: 2 }
      d1_change_by_example: { accept: [spread_by_example], weight: 2 }
      d1_individual_sovereignty: { accept: [freedom_through_association], weight: 1 }
      d1_distribution: { accept: [by_need], weight: 1 }

  - id: zapatismo
    name: Zapatismo
    aliases: [neozapatismo, Zapatista autonomy]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that communities should govern themselves through assemblies whose
      delegates lead by obeying, building autonomy in practice rather than
      seizing state power, and making room for many worlds rather than one.
    reading: []
    inseparable_from:
      - ideology: democratic_confederalism
        note: >-
          Zapatismo and democratic confederalism share one structure: territory
          governed by confederated community assemblies that refuse to seek a
          state of their own. They arose among different peoples and differ
          mainly in emphasis, which position questions can only partly reach.
    stances:
      d1_land:
        accept: [village_holds_in_common]
        reject: [ceiling_on_holdings, title_follows_use]
        weight: 3
        note: >-
          Defining: land recovered and held by the community is the material basis
          of the self-governing territory, not a policy applied inside one. Reverse
          it and there is nothing for the assemblies to govern.
      d1_wealth_from_periphery: { accept: [strongly_agree, agree], weight: 1 }
      d1_nation_self_gov:
        accept: [confederation_no_state, autonomy_where_we_live]
        reject: [own_state_socialist]
        weight: 3
        note: >-
          Defining: govern the territory through the communities' own
          assemblies, and do not seek the state. Reverse it and this is an
          ordinary movement of national liberation.
      d1_state_role: { accept: [bypass_and_build], reject: [use_and_expand, smash_and_replace, win_own_state], weight: 2 }
      d1_change_by_example: { accept: [network_of_alternatives], weight: 2 }
      d1_change_route: { accept: [prefigure_and_replace], weight: 2 }
      d1_violence: { accept: [defensive_only], weight: 2 }
      d1_faith_grounds: null
      d1_decisive_agent: { accept: [colonised_peoples, peasants_rural_poor], weight: 1 }
      d1_imperialism_primary: { accept: [both_intertwined, nations_primary], weight: 1 }
      d1_ownership: { accept: [common_ownership_no_market], weight: 1 }
      d1_single_subject: { accept: [each_its_own], weight: 1 }

