  - id: leninism
    name: Leninism
    aliases: [Bolshevism]
    family: marxism_leninism
    roster_tier: core
    summary: >-
      Holds that a disciplined party of professional revolutionaries is required
      to turn spontaneous struggle into a seizure of power, and that the old
      state must be broken rather than captured.
    reading: []
    stances:
      d1_party_needed:
        accept: [union_ideas_only]
        reject: [revolutionary_through_struggle, no_ready_made_politics]
        weight: 3
        note: >-
          Defining: left to their own experience workers arrive at better terms and
          no further, which is the entire reason the party has to exist and be built
          before the moment. Reverse it and there is no case for a party of a new
          type at all.
      d1_state_neutrality:
        accept: [built_to_protect_property]
        reject: [staffed_by_one_layer, it_is_a_proper_check]
        weight: 3
        note: >-
          Defining: the existing apparatus is built for one purpose and cannot be
          inherited. Reverse it and the whole strategy becomes winning office and
          staffing the ministries differently, which is the position Leninism
          separated from.
      d1_religion_and_liberation: { accept: [obstacle_to_liberation, private_matter], weight: 2 }
      d1_wealth_from_periphery: { accept: [agree], weight: 1 }
      d1_change_route:
        accept: [organised_insurrection]
        reject: [win_elections_and_legislate, prefigure_and_replace]
        weight: 3
        note: >-
          Defining: the decisive moment is short and an organisation has to be
          built in advance to take it. Reverse it and the parliamentary road is
          enough, which is the position this broke from.
      d1_party_role:
        accept: [lead_and_direct]
        reject: [refuse_to_direct, dissolve_into_movement]
        weight: 3
        note: >-
          Defining: a disciplined organisation supplies the programme the
          movement will not arrive at on its own. Reverse it and there is no
          Leninism left, only the mass party it argued with.
      d1_world_revolution: { accept: [only_holding_operation], reject: [self_reliance], weight: 2 }
      d1_ownership: { accept: [public_ownership_planned], weight: 2 }
      d1_planning_or_market: { accept: [central_plan_with_targets], weight: 2 }
      d1_decisive_agent: { accept: [industrial_workers, all_wage_workers], weight: 2 }
      d1_single_subject: { accept: [class_decisive], weight: 2 }
      d1_imperialism_primary: { accept: [both_intertwined, class_everywhere], weight: 2 }
      d1_distribution: { accept: [by_labour], weight: 2 }
      d1_guiding_leader: { accept: [collective_leadership], weight: 2 }
      d1_change_by_example: { accept: [support_wider_struggle], weight: 2 }
      d1_workplace_control: { accept: [public_authority_manages], weight: 1 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], weight: 1 }
      d1_individual_sovereignty: { accept: [collective_prior], weight: 1 }
      d1_growth: { accept: [agree], weight: 1 }

  - id: marxism_leninism
    name: Marxism–Leninism
    aliases: [orthodox communism, the general line]
    family: marxism_leninism
    tendency: leninism
    roster_tier: core
    summary: >-
      Holds that the vanguard party leads the state through a long transition,
      directing a planned economy and defending the revolution against internal
      and external enemies until classes are abolished.
    reading: []
    stances:
      d1_land: { accept: [state_or_collective_farms], reject: [ceiling_on_holdings], weight: 2 }
      d1_world_revolution:
        accept: [yes_one_country]
        reject: [only_holding_operation, wrong_question]
        weight: 3
        note: >-
          Defining: socialism can be built and held in one country. Reverse it
          and the whole post-revolutionary programme — the pace, the
          self-sufficiency, the quarrel with Trotskyism — goes with it.

  - id: stalinism
    name: Stalinism
    aliases: [socialism in one country]
    family: marxism_leninism
    tendency: marxism_leninism
    lineage: true
    roster_tier: core
    summary: >-
      Holds that a socialist state can and must be built in one country through
      rapid industrialisation and collectivisation, with the party exercising
      firm centralised control against encirclement and sabotage.
    reading: []
    stances:
      d1_guiding_leader:
        accept: [leaders_thought_settles]
        reject: [members_decide, no_leaders]
        weight: 3
        note: >-
          Defining: one leader's line settles disputes, and defending that
          record is what marks the tradition out. Reverse it and this is the
          general Marxist-Leninist line.
      d1_growth: { accept: [strongly_agree], weight: 2 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], weight: 2 }
      d1_civil_liberties: { accept: [conditional_on_revolution], weight: 2 }
      # The state grows stronger as socialism advances, and withers only once
      # the encirclement ends: the doctrinal break with the general line, which
      # expects it to fall away with the transition.
      d1_state_after_transition: { accept: [retained_as_planner], reject: [never_existed_as_such], weight: 2 }

  - id: titoism
    name: Titoism
    aliases: [Yugoslav self-management socialism, workers' self-management]
    family: marxism_leninism
    tendency: marxism_leninism
    roster_tier: core
    summary: >-
      Holds that socialism means enterprises run by their own workers' councils
      within a market, a state that devolves rather than concentrates power, and
      independence from any bloc.
    reading: []
    stances:
      d1_price_signals: { accept: [agree], weight: 2 }
      d1_land: { accept: [to_those_who_work_it], weight: 1 }
      d1_ownership:
        accept: [worker_owned_market]
        reject: [public_ownership_planned]
        weight: 3
        note: >-
          Defining: social ownership held by the workforce of each enterprise
          rather than by the ministries. Reverse it and this is the Soviet model
          it broke from.
      d1_workplace_control:
        accept: [workers_self_manage]
        reject: [public_authority_manages]
        weight: 3
        note: >-
          Defining: the workers' council runs the enterprise. Reverse it and
          self-management, which is the whole distinguishing claim, is gone.
      d1_planning_or_market: { accept: [market_between_worker_firms], reject: [central_plan_with_targets], weight: 2 }

  - id: hoxhaism
    name: Hoxhaism
    aliases: [anti-revisionist Marxism–Leninism]
    family: marxism_leninism
    tendency: stalinism
    lineage: true
    roster_tier: niche
    summary: >-
      Holds that every major communist state after Stalin abandoned Marxism for
      revisionism, so the task is to defend the original line intact, in
      isolation if necessary.
    reading: []
    stances:
      d1_world_revolution:
        accept: [self_reliance]
        reject: [yes_one_country, regional_union]
        weight: 3
        note: >-
          Defining: every other socialist state abandoned the line, so this one
          stands alone. Reverse it and the anti-revisionist quarrel that
          constitutes the tradition disappears.

  - id: guevarism
    name: Guevarism
    aliases: [foquismo, Guevarist internationalism]
    family: marxism_leninism
    tendency: marxism_leninism
    lineage: true
    roster_tier: core
    summary: >-
      Holds that a committed armed nucleus can create revolutionary conditions
      rather than wait for them, and that socialism requires forming a new kind
      of person motivated by solidarity rather than material reward.
    reading: []
    stances:
      d1_violence:
        accept: [armed_struggle_now]
        reject: [not_needed_legal, principled_nonviolence]
        weight: 3
        note: >-
          Defining: an armed nucleus creates the revolutionary conditions rather
          than waiting for them. Reverse it and this is the orthodox line that
          the party builds and waits.
      d1_change_route: { accept: [protracted_armed_struggle], reject: [win_elections_and_legislate], weight: 3, note: "Defining: the guerrilla column, not the mass party, is the form the revolution takes. Reverse it and foquismo has no content." }
      d1_world_revolution: { accept: [only_holding_operation], reject: [yes_one_country], weight: 2 }
      d1_decisive_agent: { accept: [peasants_rural_poor], weight: 2 }
      d1_imperialism_primary: { accept: [nations_primary, both_intertwined], weight: 2 }
      d1_distribution: { accept: [by_need], weight: 1 }

  - id: castroism
