# Ideologies — the purged roster, 93 entries.
#
# Skeleton: `stances: {}` and `reading: []` throughout. Stances are authored
# once the question bank is rebuilt against this roster; docs/roster-todo.md
# tracks the count per ideology.
#
# `tendency` names another ideology in the same family that acts as this one's
# parent node. It is set only where a descent is genuinely uncontested, so most
# entries have none — a flat family is more honest than an invented lineage.
# Every parent proposed here is recorded in docs/roster-decisions.md.
#
# Tiering: core = an ideology a test-taker could plausibly land on; niche = the
# rest; boundary = the entries marked as boundary cases on the source roster.
# Exclusions are recorded in docs/roster-purged.md.

ideologies:

  # ===========================================================================
  # Pre-Marxist and early socialism
  # ===========================================================================

  - id: narodnism
    name: Narodnism
    aliases: [Narodnichestvo, agrarian socialism, populist socialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that a peasant country can reach socialism through its existing
      village commune without first passing through capitalism, if the
      intelligentsia goes to the people rather than over them.
    reading: []
    stances:
      d1_land:
        accept: [village_holds_in_common]
        reject: [to_those_who_work_it, ceiling_on_holdings]
        weight: 3
        note: >-
          Defining: the village commune is the institution socialism is built out
          of, which is why the country need not pass through capitalism first.
          Reverse it — divide the land into family farms — and the road Narodnism
          argues for closes.
      d1_reforms_accumulate: { accept: [disagree], weight: 1 }
      d1_state_neutrality: { accept: [built_to_protect_property], weight: 1 }
      d1_party_needed: { accept: [union_ideas_only], weight: 1 }
      d1_decisive_agent:
        accept: [peasants_rural_poor]
        reject: [industrial_workers]
        weight: 3
        note: >-
          Defining: the peasant commune is the road to socialism. Reverse it and
          the country must pass through capitalism and build an industrial
          working class first, which is the position Narodnism argued against.
      d1_ownership: { accept: [common_ownership_no_market], weight: 1 }
      d1_technology_scale: { accept: [break_it_up_for_local_control], weight: 1 }

  - id: owenism
    name: Owenism
    aliases: [Owenite socialism, cooperative socialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that character is formed by circumstances, so building cooperative
      communities with humane work, education and common ownership will
      demonstrate a better order and spread it by example.
    reading: []
    stances:
      d1_price_signals: { accept: [strongly_disagree], weight: 1 }
      d1_police_and_army: { accept: [no_armed_body], weight: 1 }
      d1_change_by_example:
        accept: [spread_by_example]
        reject: [support_wider_struggle]
        weight: 3
        note: >-
          Defining: the model community demonstrates the better order and it
          spreads by imitation. Without that, Owenism is a factory reform
          programme rather than a socialism.
      d1_state_role: { accept: [bypass_and_build], weight: 2 }
      d1_change_route: { accept: [prefigure_and_replace], reject: [organised_insurrection], weight: 2 }
      d1_distribution: { accept: [by_labour], weight: 2 }
      d1_individual_sovereignty: { accept: [collective_prior], weight: 2 }
      d1_faith_grounds: { accept: [secular_reason], reject: [grounds_it], weight: 2 }
      d1_violence: { accept: [principled_nonviolence, not_needed_legal], weight: 1 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], weight: 1 }

  - id: fourierism
    name: Fourierism
    aliases: [Fourierist associationism, phalansterianism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that work becomes attractive when it is matched to people's actual
      passions, and that communities should be organised so that everyone does
      what they are drawn to in varied short spells.
    reading: []
    stances:
      d1_change_by_example:
        accept: [spread_by_example]
        reject: [support_wider_struggle]
        weight: 3
        note: >-
          Defining: one working association would show that attractive work is
          possible and the rest would follow. Reverse it and the phalanx is no
          longer the method, only an ideal.
      d1_state_role: { accept: [bypass_and_build], weight: 2 }
      d1_change_route: { accept: [prefigure_and_replace], reject: [organised_insurrection], weight: 2 }
      d1_individual_sovereignty: { accept: [freedom_through_association], weight: 2 }
      d1_workplace_control: { accept: [workers_self_manage], weight: 1 }
      d1_violence: { accept: [principled_nonviolence, not_needed_legal], weight: 1 }

  - id: saint_simonianism
    name: Saint-Simonianism
    aliases: [Saint-Simonian socialism, industrialism]
    family: early_socialism
    roster_tier: niche
    summary: >-
      Holds that society should be directed by those who actually produce —
      engineers, scientists, industrialists and workers — with reward following
      contribution and inherited privilege abolished.
    reading: []
    stances:
      d1_price_signals: { accept: [disagree], weight: 2 }
      d1_reforms_accumulate: { accept: [agree], weight: 1 }
      d1_owners_resist: { accept: [accept_the_law], weight: 1 }
      d1_state_neutrality: { accept: [staffed_by_one_layer], weight: 2 }
      d1_distribution:
        accept: [by_labour]
        reject: [by_need]
        weight: 3
        note: >-
          Defining: reward follows capacity and work, with inherited privilege
          abolished. Reverse it and the attack on idle ownership, which is the
          doctrine's point, falls away.
      d1_state_role: { accept: [use_and_expand], weight: 2 }
      d1_ownership: { accept: [public_ownership_planned], weight: 2 }
      d1_planning_or_market: { accept: [central_plan_with_targets, computed_plan], weight: 2 }
      d1_workplace_control: { accept: [public_authority_manages], weight: 2 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], reject: [forgo_it], weight: 2 }
      d1_growth: { accept: [strongly_agree], weight: 2 }
      d1_change_by_example: { accept: [win_legislation], weight: 1 }
      d1_individual_sovereignty: { accept: [collective_prior], weight: 1 }

  # ===========================================================================
  # Liberal left
  # ===========================================================================

  - id: social_liberalism
    name: Social liberalism
    aliases: [left-liberalism, new liberalism, progressive liberalism]
    family: liberal_left
    roster_tier: core
    summary: >-
      Holds that formal liberty is empty without the material conditions to use
      it, so the state should guarantee health, education, income security and
      fair opportunity within a regulated market economy.
    reading: []
    stances:
      d1_expropriation: { accept: [full_market_compensation, no_transfer_at_all], weight: 2 }
      d1_owners_resist: { accept: [accept_the_law], weight: 2 }
      d1_party_needed: { accept: [argued_out_between_people], weight: 1 }
      d1_organisation_form: { accept: [mass_membership_party], weight: 1 }
      d1_religion_and_liberation: { accept: [private_matter], weight: 1 }
      d1_ownership:
        accept: [private_with_strong_public]
        reject: [common_ownership_no_market, public_ownership_planned]
        weight: 3
        note: >-
          Defining: a regulated market economy with a guaranteed floor. Reverse
          it and the position becomes liberal or democratic socialism.
      d1_distribution: { accept: [market_income_plus_floor], reject: [by_need], weight: 2 }
      d1_state_role: { accept: [use_and_expand], reject: [smash_and_replace, abolish_outright], weight: 2 }
      d1_change_route: { accept: [win_elections_and_legislate], reject: [organised_insurrection], weight: 2 }
      d1_planning_or_market: { accept: [regulated_market], reject: [central_plan_with_targets], weight: 2 }
      d1_workplace_control: { accept: [owners_under_regulation, codetermination], weight: 2 }
      d1_civil_liberties: { accept: [liberties_are_the_point, ordinary_law_only], reject: [conditional_on_revolution], weight: 2 }
      d1_imperialism_primary: { accept: [not_primary_structure], weight: 2 }
      d1_decisive_agent: { accept: [citizens_majority], weight: 2 }
      d1_individual_sovereignty: { accept: [rights_balanced_by_law], weight: 2 }
      d1_change_by_example: { accept: [win_legislation], weight: 2 }
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 1 }
      d1_faith_grounds: { accept: [ethical_ideal], weight: 1 }
      d1_guiding_leader: { accept: [members_decide], weight: 1 }

  - id: liberal_socialism
    name: Liberal socialism
    aliases: [social-liberal socialism, ethical liberal socialism]
    family: liberal_left
    roster_tier: core
    summary: >-
      Holds that liberal freedoms and socialist economics require each other,
      and that social ownership is justified precisely because it extends
      individual autonomy rather than subordinating it to the state.
    reading: []
    stances:
      d1_expropriation: { accept: [full_market_compensation, buy_out_gradually], reject: [no_compensation], weight: 2 }
      d1_owners_resist: { accept: [fight_within_rules], weight: 1 }
      d1_party_needed: { accept: [argued_out_between_people], weight: 1 }
      d1_organisation_form: { accept: [mass_membership_party], weight: 1 }
      d1_religion_and_liberation: { accept: [private_matter], weight: 1 }
      d1_civil_liberties:
        accept: [liberties_are_the_point]
        reject: [conditional_on_revolution, restrict_during_emergency]
        weight: 3
        note: >-
          Defining: liberal freedoms are what socialism is for, not a means to
          it. Reverse it and what is left is socialism without the liberalism.
      d1_state_role: { accept: [use_and_expand], weight: 2 }
      d1_change_route: { accept: [win_elections_and_legislate], weight: 2 }
      d1_faith_grounds: { accept: [ethical_ideal], weight: 2 }
      d1_individual_sovereignty: { accept: [rights_balanced_by_law, freedom_through_association], weight: 2 }
      d1_ownership: { accept: [public_ownership_planned, worker_owned_market], weight: 1 }
      d1_planning_or_market: { accept: [regulated_market, market_between_worker_firms], weight: 1 }
      d1_workplace_control: { accept: [workers_self_manage, codetermination], weight: 1 }
      d1_distribution: { accept: [market_income_plus_floor], weight: 1 }
      d1_change_by_example: { accept: [win_legislation], weight: 1 }

  - id: distributism
    name: Distributism
    aliases: [distributivism]
    family: liberal_left
    roster_tier: boundary
    boundary: true
    summary: >-
      Holds that productive property should be spread as widely as possible
      among families, smallholders and guilds, so that neither large private
      capital nor the state stands between people and their livelihood.
    reading: []
    stances:
      d1_expropriation: { accept: [no_transfer_at_all], weight: 2 }
      d1_land: { accept: [ceiling_on_holdings], reject: [state_or_collective_farms], weight: 2 }
      d1_religion_and_liberation: { accept: [ally_of_liberation], weight: 2 }
      d1_ownership:
        accept: [widely_held_small_property]
        reject: [public_ownership_planned, common_ownership_no_market, private_with_strong_public]
        weight: 3
        note: >-
          Defining: productive property spread as widely as possible. Reverse it
          and nothing separates it from either large private capital or
          collective ownership, both of which it exists to oppose.
      d1_faith_grounds: { accept: [grounds_it], weight: 2 }
      d1_technology_scale: { accept: [break_it_up_for_local_control], reject: [run_it_and_socialise_gains], weight: 2 }
      d1_planning_or_market: { accept: [regulated_market], reject: [central_plan_with_targets], weight: 1 }
      d1_change_route: { accept: [win_elections_and_legislate], weight: 1 }

  # ===========================================================================
  # Social democracy
  # ===========================================================================

  - id: kautskyism
    name: Kautskyism
    aliases: [orthodox Marxism, Second International Marxism]
    family: social_democracy
    roster_tier: core
    summary: >-
      Holds that capitalism's own development makes the working class the
      majority, so a mass socialist party should win power through the ballot
      and inherit an economy already ripe for socialisation.
    reading: []
    stances:
      d1_reforms_accumulate: { accept: [disagree], reject: [strongly_agree], weight: 2 }
      d1_price_signals: { accept: [disagree], weight: 1 }
      d1_owners_resist: { accept: [capital_strike, resist_by_any_means], weight: 2 }
      d1_state_neutrality: { accept: [balance_of_forces], weight: 1 }
      d1_party_needed: { accept: [union_ideas_only], reject: [no_ready_made_politics], weight: 2 }
      d1_ownership:
        accept: [public_ownership_planned]
        reject: [private_with_strong_public]
        weight: 3
        note: >-
          Defining: socialised production is the final goal the ballot is for.
          Reverse it and Kautskyism becomes the revisionism it argued against.
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 2 }
      d1_decisive_agent: { accept: [all_wage_workers, industrial_workers], weight: 2 }
      d1_faith_grounds: { accept: [material_interest], weight: 2 }
      d1_single_subject: { accept: [class_decisive], weight: 2 }
      d1_planning_or_market: { accept: [central_plan_with_targets], weight: 1 }
      d1_workplace_control: { accept: [public_authority_manages], weight: 1 }
      d1_imperialism_primary: { accept: [class_everywhere], weight: 1 }
      d1_distribution: { accept: [by_labour], weight: 1 }
      d1_guiding_leader: { accept: [collective_leadership], weight: 1 }

  - id: classical_social_democracy
    name: Classical social democracy
    aliases: [post-war social democracy, welfare-state social democracy]
    family: social_democracy
    roster_tier: core
    summary: >-
      Uses parliamentary majorities and strong unions to build universal public
      provision, full employment and collective bargaining on top of a mixed
      economy, treating the resulting settlement as durable.
    reading: []
    stances:
      d1_owners_resist: { accept: [fight_within_rules, capital_strike], weight: 2 }
      d1_state_neutrality: { accept: [staffed_by_one_layer], weight: 2 }
      d1_distribution:
        accept: [market_income_plus_floor]
        reject: [by_need]
        weight: 3
        note: >-
          Defining: a universal floor on top of market incomes is the settlement
          itself. Reverse it and the goal becomes replacing the market, which is
          democratic socialism.
      d1_ownership: { accept: [private_with_strong_public], weight: 2 }
      d1_planning_or_market: { accept: [regulated_market], weight: 2 }
      d1_workplace_control: { accept: [codetermination, owners_under_regulation], weight: 2 }
      d1_decisive_agent: { accept: [all_wage_workers], weight: 2 }
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 1 }
      d1_imperialism_primary: { accept: [not_primary_structure], weight: 1 }
      d1_faith_grounds: { accept: [ethical_ideal], weight: 1 }
      d1_individual_sovereignty: { accept: [rights_balanced_by_law], weight: 1 }
      d1_growth: { accept: [agree], weight: 1 }
      d1_guiding_leader: { accept: [collective_leadership], weight: 1 }

  - id: bernsteinian_revisionism
    name: Bernsteinian revisionism
    aliases: [revisionism, evolutionary socialism]
    family: social_democracy
    tendency: classical_social_democracy
    roster_tier: niche
    summary: >-
      Holds that capitalism will not collapse of its own accord, so socialism
      has to be reached by the accumulation of reforms, and that the movement's
      daily work matters more than the final goal.
    reading: []
    stances:
      d1_expropriation: { accept: [buy_out_gradually], reject: [no_compensation, workers_take_directly], weight: 2 }
      d1_owners_resist: { accept: [accept_the_law, fight_within_rules], weight: 2 }
      d1_state_neutrality: { accept: [staffed_by_one_layer, it_is_a_proper_check], weight: 2 }
      d1_faith_grounds: { accept: [ethical_ideal], reject: [material_interest], weight: 2 }
      d1_change_by_example: { accept: [win_legislation], weight: 2 }

  - id: fabianism
    name: Fabianism
    aliases: [Fabian socialism, gradualism]
    family: social_democracy
    roster_tier: niche
    summary: >-
      Holds that socialism arrives by permeating existing institutions with
      expert argument and incremental legislation, so that collective provision
      is adopted because it is demonstrably better administered.
    reading: []
    stances:
      d1_owners_resist: { accept: [accept_the_law], weight: 2 }
      d1_state_neutrality:
        accept: [staffed_by_one_layer]
        reject: [built_to_protect_property, any_apparatus_defends_itself]
        weight: 3
        note: >-
          Defining: the permanent institutions are instruments that will serve
          whoever staffs and advises them, which is why the method is to staff and
          advise them rather than to confront them. Reverse it and Fabian permeation
          has no point.
      d1_organisation_form: null
      d1_change_by_example:
        accept: [win_legislation]
        reject: [spread_by_example]
        weight: 3
        note: >-
          Defining: permeation — prove a measure works and have government adopt
          it. Reverse it and gradualism by expert persuasion has no method left.
      d1_workplace_control: { accept: [public_authority_manages], reject: [union_runs_it], weight: 2 }
      d1_ownership: { accept: [public_ownership_planned], weight: 2 }
      d1_decisive_agent: { accept: [citizens_majority], weight: 2 }
      d1_distribution: { accept: [market_income_plus_floor], weight: 2 }
      d1_planning_or_market: { accept: [central_plan_with_targets], weight: 1 }
      d1_imperialism_primary: { accept: [not_primary_structure], weight: 1 }
      d1_faith_grounds: { accept: [ethical_ideal], weight: 1 }
      d1_individual_sovereignty: { accept: [collective_prior], weight: 1 }
      d1_technology_scale: { accept: [run_it_and_socialise_gains], weight: 1 }

  - id: democratic_socialism
    name: Democratic socialism
    aliases: [parliamentary socialism]
    family: social_democracy
    roster_tier: core
    summary: >-
      Uses elections and mass organisation to replace private ownership of the
      major productive assets with social ownership, holding that socialism
      without democracy is not socialism.
    reading: []
    stances:
      d1_owners_resist: { accept: [capital_strike, fight_within_rules], weight: 2 }
      d1_state_neutrality: { accept: [balance_of_forces], weight: 2 }
      d1_ownership:
        accept: [public_ownership_planned, worker_owned_market]
        reject: [private_with_strong_public]
        weight: 3
        note: >-
          Defining: private ownership of the major productive assets is to be
          replaced, by electoral means. Reverse it and this is classical social
          democracy's permanent mixed economy.
      d1_workplace_control: { accept: [workers_self_manage, codetermination], weight: 2 }
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 2 }
      d1_decisive_agent: { accept: [all_wage_workers], weight: 2 }
      d1_single_subject: { accept: [class_plus_autonomous], weight: 2 }
      d1_imperialism_primary: { accept: [both_intertwined], weight: 1 }
      d1_faith_grounds: { accept: [ethical_ideal], weight: 1 }
      d1_guiding_leader: { accept: [members_decide], weight: 1 }

  - id: austromarxism
    name: Austromarxism
    aliases: [Austrian Marxism]
    family: social_democracy
    roster_tier: niche
    summary: >-
      Seeks a democratic road to socialism through patient mass organisation and
      workers' self-education, and treats national and cultural difference as
      something a socialist state should accommodate rather than dissolve.
    reading: []
    stances:
      d1_owners_resist: { accept: [resist_by_any_means], weight: 2 }
      d1_state_neutrality: { accept: [balance_of_forces], weight: 2 }
      d1_nation_self_gov:
        accept: [autonomy_where_we_live]
        reject: [own_state_socialist, independence_first]
        weight: 3
        note: >-
          Defining: national self-government by person rather than territory,
          inside a multinational state. Reverse it and this is ordinary Second
          International social democracy.
      d1_violence: { accept: [defensive_only], weight: 2 }
      d1_ownership: { accept: [public_ownership_planned], weight: 2 }
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 2 }
      d1_decisive_agent: { accept: [all_wage_workers], weight: 1 }
      d1_faith_grounds: { accept: [material_interest], weight: 1 }
      d1_imperialism_primary: { accept: [class_everywhere], weight: 1 }
      d1_single_subject: { accept: [class_decisive], weight: 1 }
      d1_distribution: { accept: [by_labour], weight: 1 }

  - id: third_way
    name: Third Way
    aliases: [New Labour, market-liberal social democracy, radical centre]
    family: social_democracy
    tendency: bernsteinian_revisionism
    roster_tier: boundary
    boundary: true
    summary: >-
      Accepts market allocation and private ownership as settled and pursues
      social justice through investment in skills, opportunity and a floor under
      the worst outcomes rather than through changing who owns what.
    reading: []
    stances:
      d1_expropriation: { accept: [no_transfer_at_all], weight: 2 }
      d1_state_neutrality: { accept: [it_is_a_proper_check], weight: 2 }
      d1_wealth_from_periphery: { accept: [disagree], weight: 1 }
      d1_planning_or_market:
        accept: [regulated_market]
        reject: [central_plan_with_targets, negotiated_plan_between_units]
        weight: 3
        note: >-
          Defining: markets are settled, and the task is to equip people to do
          well inside them. Reverse it and this is ordinary social democracy.
      d1_workplace_control: { accept: [owners_under_regulation], reject: [workers_self_manage, union_runs_it], weight: 2 }
      d1_decisive_agent: { accept: [citizens_majority], reject: [industrial_workers], weight: 2 }
      d1_imperialism_primary: { accept: [not_primary_structure], weight: 2 }
      d1_individual_sovereignty: { accept: [rights_balanced_by_law], weight: 2 }
      d1_growth: { accept: [agree], weight: 2 }

  # ===========================================================================
  # Market and cooperative socialism
  # ===========================================================================

  - id: market_socialism
    name: Market socialism
    aliases: [socialist market economy, worker-cooperative socialism]
    family: market_socialism
    roster_tier: core
    summary: >-
      Holds that enterprises should be owned by those who work in them or by the
      public, while competing and trading in markets, because prices carry
      information no planning body can assemble.
    reading: []
    stances:
      d1_price_signals:
        accept: [strongly_agree, agree]
        reject: [strongly_disagree]
        weight: 3
        note: >-
          Defining: prices formed between socially owned firms are what the
          tradition offers in place of a plan. Reverse it and the case for markets
          under social ownership collapses into a case for planning, which is a
          different tradition.
      d1_owners_resist: { accept: [fight_within_rules], weight: 1 }
      d1_state_neutrality: { accept: [staffed_by_one_layer], weight: 1 }
      d1_police_and_army: { accept: [accountable_professional_force], weight: 1 }
      d1_ownership:
        accept: [worker_owned_market]
        reject: [public_ownership_planned, private_with_strong_public]
        weight: 3
        note: >-
          Defining: the firms are owned by the people who work in them. Reverse
          it and the market is an ordinary capitalist one.
      d1_planning_or_market:
        accept: [market_between_worker_firms]
        reject: [central_plan_with_targets, direct_allocation_by_need]
        weight: 3
        note: >-
          Defining: markets coordinate the socially owned firms. Reverse it and
          this is planned socialism.
      d1_state_role: { accept: [use_and_expand], weight: 2 }
      d1_change_route: { accept: [win_elections_and_legislate], weight: 2 }
      d1_distribution: { accept: [by_labour, market_income_plus_floor], weight: 1 }
      d1_decisive_agent: { accept: [all_wage_workers], weight: 1 }
      d1_violence: { accept: [not_needed_legal], weight: 1 }
      d1_civil_liberties: { accept: [liberties_are_the_point], weight: 1 }
      d1_party_role: { accept: [fight_for_its_line_democratically], weight: 1 }

  - id: guild_socialism
    name: Guild socialism
    aliases: [national guilds]
    family: market_socialism
    roster_tier: core
    summary: >-
      Holds that industries should be run by self-governing guilds of those who
      work in them, with a state representing people as consumers, so that
      neither producers nor the public dominates the other.
    reading: []
    stances:
      d1_price_signals: { accept: [disagree], weight: 1 }
      d1_owners_resist: { accept: [capital_strike], weight: 1 }
      d1_state_neutrality: { accept: [any_apparatus_defends_itself], weight: 2 }
      d1_party_needed: { accept: [revolutionary_through_struggle], weight: 1 }
