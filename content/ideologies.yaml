        note: >-
          Defining: take what you need from the common store, with no accounting
          of contribution. Reverse it and this is the collectivism it grew out
          of and broke with.
      d1_ownership: { accept: [common_ownership_no_market], reject: [occupancy_and_use], weight: 2 }
      d1_planning_or_market: { accept: [direct_allocation_by_need, negotiated_plan_between_units], weight: 2 }
      d1_individual_sovereignty: { accept: [freedom_through_association], weight: 2 }
      d1_change_by_example: { accept: [network_of_alternatives], weight: 1 }
      d1_change_route: { accept: [build_counter_power_then_rupture, prefigure_and_replace], weight: 1 }
      d1_workplace_control: { accept: [workers_self_manage], weight: 1 }
      d1_violence: { accept: [rupture_necessary], weight: 1 }

  - id: anarcho_syndicalism
    name: Anarcho-syndicalism
    aliases: [revolutionary unionism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that revolutionary unions are both the weapon of the struggle and
      the framework that runs production afterwards, with the general strike as
      the decisive method.
    reading: []
    stances:
      d1_organisation_form:
        accept: [workplace_bodies]
        reject: [mass_membership_party, disciplined_cadre_body]
        weight: 3
        note: >-
          Defining: the union built at the point of production is both the body that
          fights now and the body that runs production afterwards, which is what
          distinguishes it from the anarchism that organises where people live.
          Reverse it and the union is one organ among several.
      d1_land: { accept: [village_holds_in_common], weight: 1 }
      d1_price_signals: { accept: [disagree], weight: 1 }
      d1_workplace_control:
        accept: [union_runs_it]
        reject: [public_authority_manages, owners_under_regulation]
        weight: 3
        note: >-
          Defining: the workers' own organisation is both the weapon now and the
          body that runs production afterwards. Reverse it and this is anarchist
          communism organised around the commune instead.
      d1_change_route:
        accept: [build_counter_power_then_rupture]
        reject: [win_elections_and_legislate]
        weight: 3
        note: >-
          Defining: the general strike out of the workplace, not the ballot and
          not the armed column. Reverse it and the syndicalist method is gone.
      d1_decisive_agent: { accept: [industrial_workers, all_wage_workers], weight: 2 }
      d1_single_subject: { accept: [class_decisive], weight: 2 }
      d1_state_role: { accept: [bypass_and_build, abolish_outright], reject: [use_and_expand, smash_and_replace, win_own_state], weight: 2 }
      d1_ownership: { accept: [common_ownership_no_market], weight: 1 }
      d1_planning_or_market: { accept: [negotiated_plan_between_units], weight: 1 }
      d1_imperialism_primary: { accept: [class_everywhere], weight: 1 }
      d1_individual_sovereignty: { accept: [freedom_through_association], weight: 1 }
      d1_violence: { accept: [defensive_only, rupture_necessary], weight: 1 }

  - id: insurrectionary_anarchism
    name: Insurrectionary anarchism
    aliases: [insurrectionism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that permanent organisations become ends in themselves, so revolt
      should be carried by small groups acting now, on their own initiative,
      rather than deferred to a mass movement that may never arrive.
    reading: []
    stances:
      d1_organisation_form: { accept: [as_little_as_possible], weight: 2 }
      d1_violence:
        accept: [offensive_action]
        reject: [not_needed_legal, principled_nonviolence]
        weight: 3
        note: >-
          Defining: attack now, without waiting for a mass movement, because the
          attack is what shows the order can be broken. Reverse it and this is
          the patient organisation-building it rejects.
      d1_party_role: { accept: [refuse_to_direct], weight: 2 }
      d1_change_route: { accept: [prefigure_and_replace, build_counter_power_then_rupture], weight: 1 }
      d1_individual_sovereignty: { accept: [freedom_through_association, individual_is_the_point], weight: 1 }

  - id: individualist_anarchism
    name: Individualist anarchism
    aliases: [anarchist individualism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that the sovereignty of the individual is the point of the whole
      project, and that association is legitimate only where it is voluntary and
      revocable by each person in it.
    reading: []
    stances:
      d1_expropriation: null
      d1_land: { accept: [title_follows_use], weight: 2 }
      d1_price_signals: { accept: [strongly_agree], weight: 2 }
      d1_individual_sovereignty:
        accept: [individual_is_the_point]
        reject: [collective_prior]
        weight: 3
        note: >-
          Defining: the individual is sovereign and no association may dispose
          of them. Reverse it and this is the social anarchism it stands apart
          from.
      d1_ownership: { accept: [occupancy_and_use, widely_held_small_property], weight: 2 }
      d1_distribution: { accept: [free_exchange], reject: [by_need], weight: 2 }
      d1_planning_or_market: { accept: [market_between_worker_firms], weight: 1 }
      d1_violence: { accept: [defensive_only], weight: 1 }

  - id: egoism
    name: Egoism
    aliases: [Stirnerism, egoist anarchism]
    family: anarchism
    tendency: individualist_anarchism
    roster_tier: boundary
    boundary: true
    summary: >-
      Holds that every cause above the individual — state, society, humanity,
      morality — is a fixed idea to be dissolved, leaving only the unique person
      and the unions they freely enter.
    reading: []
    stances:
      d1_ownership: null
      d1_distribution: null
      d1_planning_or_market: null
      d1_faith_grounds: { accept: [secular_reason], reject: [grounds_it, ethical_ideal], weight: 2 }

  - id: anarcho_primitivism
    name: Anarcho-primitivism
    aliases: [primitivism, green anarchy]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that domination is built into large-scale technology and agriculture
      themselves, so a free life requires unwinding civilisation rather than
      taking it over.
    reading: []
    stances:
      d1_expropriation: null
      d1_technology_scale:
        accept: [forgo_it]
        reject: [run_it_and_socialise_gains, run_it_under_direct_control]
        weight: 3
        note: >-
          Defining: the machinery itself is the domination, so it is not to be
          taken over but given up. Reverse it and this is any other green
          anarchism.
      d1_growth: { accept: [strongly_disagree], reject: [strongly_agree], weight: 2 }
      d1_ecology_priority: { accept: [strongly_agree], weight: 2 }

  - id: social_ecology
    name: Social ecology
    aliases: [communalism, libertarian municipalism, Bookchinism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that ecological crisis follows from hierarchy among people, and that
      the remedy is directly democratic municipal assemblies confederated from
      the bottom up.
    reading: []
    stances:
      d1_land: { accept: [village_holds_in_common], weight: 1 }
      d1_price_signals: { accept: [disagree], weight: 1 }
      d1_change_by_example:
        accept: [network_of_alternatives]
        reject: [win_legislation]
        weight: 3
        note: >-
          Defining: community assemblies, confederated with each other, grow
          into the power that replaces the state. Reverse it and there is no
          route from the assembly to a society.
      d1_ecology_priority: { accept: [strongly_agree, agree], weight: 2 }
      d1_technology_scale: { accept: [run_it_under_direct_control, break_it_up_for_local_control], weight: 2 }
      d1_state_role: { accept: [bypass_and_build], reject: [use_and_expand, smash_and_replace, win_own_state], weight: 2 }
      d1_change_route: { accept: [prefigure_and_replace], weight: 2 }
      d1_ownership: { accept: [common_ownership_no_market], weight: 2 }
      d1_planning_or_market: { accept: [negotiated_plan_between_units], weight: 2 }
      d1_individual_sovereignty: { accept: [freedom_through_association], weight: 2 }
      d1_growth: { accept: [disagree, strongly_disagree], weight: 1 }
      d1_violence: { accept: [defensive_only], weight: 1 }
      d1_decisive_agent: { accept: [citizens_majority], weight: 1 }

  - id: post_left_anarchy
    name: Post-left anarchy
    aliases: [post-leftism]
    family: anarchism
    roster_tier: core
    summary: >-
      Holds that the organised left reproduces the ideology, morality and work
      discipline it claims to oppose, so anarchism should break with it and
      begin from lived refusal instead.
    reading: []
    stances:
      d1_party_needed: { accept: [no_ready_made_politics], weight: 2 }
      d1_organisation_form: { accept: [as_little_as_possible], weight: 2 }
