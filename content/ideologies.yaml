  - id: juche
    name: Juche
    aliases: [Kimilsungism, self-reliance thought]
    family: marxism_leninism
    tendency: marxism_leninism
    roster_tier: boundary
    boundary: true
    summary: >-
      Holds that a nation is master of its own destiny only through political
      independence, economic self-sufficiency and self-defence, with the masses
      united around a single leadership.
    reading: []
    stances:
      d1_world_revolution:
        accept: [self_reliance]
        reject: [only_holding_operation, regional_union]
        weight: 3
        note: >-
          Defining: the nation carries its revolution by its own strength and
